<rect width="1200" height="520" rx="28" fill="#faf8f4"/>
<text x="40" y="70" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="3" fill="#4f46e5">HOW OTTER.AI WORKS</text>
<text x="40" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#121420">From a live call to a list of next steps</text>
<g filter="url(#sh2)"><rect x="40" y="150" width="250" height="300" rx="22" fill="#fff" stroke="#e6e2d8"/></g>
<circle cx="165" cy="235" r="48" fill="url(#brand)"/><g transform="translate(165 235)"><rect x="-26" y="-18" width="40" height="36" rx="8" fill="none" stroke="#fff" stroke-width="5"/><path d="M14 -8l16-10v36l-16-10z" fill="#fff"/></g>
<text x="64" y="182" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2" fill="#5a6070">STEP 1</text>
<text x="165" y="330" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="800" fill="#121420">Join the meeting</text>
<text x="165" y="368" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#5a6070">Zoom, Microsoft Teams or</text>
<text x="165" y="392" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#5a6070">Google Meet, or record on</text>
<text x="165" y="416" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#5a6070">desktop</text><path d="M294 300h28" stroke="#f5b83d" stroke-width="5" stroke-linecap="round"/><path d="M314 290l12 10-12 10" fill="none" stroke="#f5b83d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#sh2)"><rect x="330" y="150" width="250" height="300" rx="22" fill="#fff" stroke="#e6e2d8"/></g>
<circle cx="455" cy="235" r="48" fill="url(#brand)"/><g transform="translate(455 235)"><g stroke="#fff" stroke-width="5" stroke-linecap="round"><path d="M-24 -14h48M-24 0h36M-24 14h44"/></g></g>
<text x="354" y="182" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2" fill="#5a6070">STEP 2</text>
<text x="455" y="330" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="800" fill="#121420">Live transcript</text>
<text x="455" y="368" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#5a6070">Speaker-labelled text</text>
<text x="455" y="392" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#5a6070">appears while people talk</text>
<text x="455" y="416" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#5a6070"></text><path d="M584 300h28" stroke="#f5b83d" stroke-width="5" stroke-linecap="round"/><path d="M604 290l12 10-12 10" fill="none" stroke="#f5b83d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#sh2)"><rect x="620" y="150" width="250" height="300" rx="22" fill="#fff" stroke="#e6e2d8"/></g>
<circle cx="745" cy="235" r="48" fill="url(#brand)"/><g transform="translate(745 235)"><rect x="-20" y="-24" width="40" height="48" rx="7" fill="none" stroke="#fff" stroke-width="5"/><g stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M-10 -10h20M-10 2h20M-10 14h12"/></g></g>
<text x="644" y="182" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2" fill="#5a6070">STEP 3</text>
<text x="745" y="330" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="800" fill="#121420">AI summary</text>
<text x="745" y="368" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#5a6070">Decisions, key points and</text>
<text x="745" y="392" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#5a6070">an outline after the call</text>
<text x="745" y="416" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#5a6070"></text><path d="M874 300h28" stroke="#f5b83d" stroke-width="5" stroke-linecap="round"/><path d="M894 290l12 10-12 10" fill="none" stroke="#f5b83d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#sh2)"><rect x="910" y="150" width="250" height="300" rx="22" fill="#fff" stroke="#e6e2d8"/></g>
<circle cx="1035" cy="235" r="48" fill="url(#brand)"/><g transform="translate(1035 235)"><path d="M-20 0l12 12 26-28" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="934" y="182" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2" fill="#5a6070">STEP 4</text>
<text x="1035" y="330" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="800" fill="#121420">Action items</text>
<text x="1035" y="368" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#5a6070">Next steps captured; AI</text>
<text x="1035" y="392" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#5a6070">Chat answers questions later</text>
<text x="1035" y="416" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#5a6070"></text>
<text x="40" y="496" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#5a6070">Based on features described on otter.ai, checked 5 Nov 2026. Illustration by Toolora.ai.</text>
