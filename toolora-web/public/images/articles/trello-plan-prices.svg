<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121420"/><stop offset=".6" stop-color="#1b1e2d"/><stop offset="1" stop-color="#2b2163"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
  <radialGradient id="glow" cx=".8" cy=".2" r=".7"><stop offset="0" stop-color="#7c3aed" stop-opacity=".45"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/></filter>
  <filter id="sh2" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#10121e" flood-opacity=".12"/></filter>
</defs>
<rect width="1200" height="600" rx="28" fill="#faf8f4"/>
<text x="40" y="70" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="3" fill="#4f46e5">TRELLO PRICING (USD PER USER / MONTH)</text>
<text x="40" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#121420">Annual vs monthly billing, by plan</text>
<rect x="760" y="96" width="18" height="18" rx="5" fill="url(#brand)"/><text x="786" y="111" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#5a6070">Billed annually</text>
<rect x="930" y="96" width="18" height="18" rx="5" fill="url(#amber)"/><text x="956" y="111" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#5a6070">Billed monthly</text>
<path d="M120 480H1120" stroke="#e6e2d8" stroke-width="2"/>
<rect x="150" y="476" width="70" height="4" rx="10" fill="url(#brand)"/><rect x="230" y="476" width="70" height="4" rx="10" fill="url(#amber)"/><text x="225" y="460" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#121420">$0</text><text x="225" y="520" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#121420">Free</text><rect x="400" y="415" width="70" height="65" rx="10" fill="url(#brand)"/><rect x="480" y="402" width="70" height="78" rx="10" fill="url(#amber)"/><text x="475" y="386" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#121420">$5 / $6</text><text x="475" y="520" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#121420">Standard</text><rect x="650" y="350" width="70" height="130" rx="10" fill="url(#brand)"/><rect x="730" y="317.5" width="70" height="162.5" rx="10" fill="url(#amber)"/><text x="725" y="301.5" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#121420">$10 / $12.50</text><text x="725" y="520" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#121420">Premium</text><rect x="900" y="252.5" width="70" height="227.5" rx="10" fill="url(#brand)"/><text x="975" y="236.5" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#121420">$17.50 / —</text><text x="975" y="520" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#121420">Enterprise</text>
<text x="40" y="570" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#5a6070">Source: trello.com/pricing, checked 5 Nov 2026. Enterprise lists an annual price only.</text>
</svg>